
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>my snowglobe!</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <h1>Kind snowglobe.</h1>
      <p class="tagline">shake it for a kind message.</p>
    </header>
    <main>
      <section class="globe-card">
        <div class="globe" id="globe">
          <img class="scene" src="snowglobe.png" alt="a snowglobe, it says hack club athena." />
        </div>
        <button id="shake">shake the globe!</button>
        <p class="message" id="message">press the button and see what settles</p>
      </section>
    </main>
    <footer>
      <p>made by me, for the snow</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
